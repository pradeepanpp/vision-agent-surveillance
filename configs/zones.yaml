behaviors:
  loitering:
    enabled: true
    description: Object stays in same zone beyond threshold
  perimeter_probing:
    enabled: true
    description: Object visits restricted zone repeatedly
    min_visits: 3
    time_window_seconds: 600
  crowd_formation:
    enabled: true
    description: Person count in a zone rises rapidly
    min_persons: 5
    time_window_seconds: 120
detection:
  model: yolo26s.pt
  confidence_threshold: 0.25
  iou_threshold: 0.45
  input_width: 640
  input_height: 360
  target_classes:
  - 0
  - 2
  - 3
  - 5
  - 7
video:
  source: data/test_video.mp4
  loop: true
  display_fps: true
  rotate_portrait: true
